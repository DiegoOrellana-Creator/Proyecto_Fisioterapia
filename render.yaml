# Blueprint de Render: crea el servicio web desde el Dockerfile.
# La base de datos está en Neon; su cadena de conexión va en DB_URL.
# Las variables con "sync: false" las pide Render al crear el servicio (son secretas).
services:
  - type: web
    name: fisioagenda
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: FisioAgenda SCZ
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: es
      - key: APP_FAKER_LOCALE
        value: es_ES
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
